<text x="193" y="220" fill="#dce6d7">uplink.200</text><text x="425" y="220" fill="#c9f464">UP</text><text x="550" y="220" fill="#c6d7c4">192.0.2.1/30</text>
<text x="193" y="248" fill="#dce6d7">uplink.201</text><text x="425" y="248" fill="#c9f464">UP</text><text x="550" y="248" fill="#c6d7c4">192.0.2.5/30</text>
