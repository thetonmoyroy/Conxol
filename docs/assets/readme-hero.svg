<text x="99" y="92" fill="#edf2e8" font-size="29" font-weight="700">conxol</text>
<text x="54" y="151" fill="#c9f464" font-size="14" letter-spacing="3">THE NETWORK OPERATOR'S WORKSPACE</text>
<text x="49" y="239" fill="#f3f5ee" font-size="80" font-weight="700" letter-spacing="-3">Your network.</text>
<text x="49" y="327" fill="#c9f464" font-size="80" font-weight="700" letter-spacing="-3">One workspace.</text>
<text x="54" y="382" fill="#b2c4b6" font-size="23">Connect. Configure. Troubleshoot.</text>
<g font-size="14" letter-spacing="1">
<rect x="54" y="431" width="114" height="32" rx="16" fill="#213626" stroke="#506b46"/><text x="69" y="452" fill="#d9ebcf">SSH / SFTP</text>
<rect x="180" y="431" width="160" height="32" rx="16" fill="#213626" stroke="#506b46"/><text x="193" y="452" fill="#d9ebcf">NETWORK TOOLS</text>
<rect x="352" y="431" width="184" height="32" rx="16" fill="#2d2a1c" stroke="#74603b"/><text x="366" y="452" fill="#f2bd76">CONFIG TEMPLATES</text>
