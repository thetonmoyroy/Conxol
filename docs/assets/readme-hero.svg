<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">Conxol — Your network. One workspace.</title>
<desc id="desc">Illustrated network operations workspace with an SSH terminal, saved devices and configuration preview. Sample addresses are reserved for documentation. Not a product screenshot.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#14271e"/><stop offset="1" stop-color="#070e0b"/></linearGradient>
<linearGradient id="panel" x2="0" y2="1"><stop stop-color="#192b22"/><stop offset="1" stop-color="#0c1711"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a9d8a8" stroke-opacity=".05"/></pattern>
</defs>
<rect width="1600" height="560" rx="22" fill="url(#bg)"/><rect width="1600" height="560" rx="22" fill="url(#grid)"/>
<path d="M35 36H1565" stroke="#c9f464" stroke-width="2" stroke-opacity=".55"/>
<g font-family="Arial, Helvetica, sans-serif">
