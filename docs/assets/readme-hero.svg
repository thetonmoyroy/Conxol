<text x="54" y="510" fill="#91aa97" font-size="14" letter-spacing="2">OPEN SOURCE</text><text x="204" y="510" fill="#48624f" font-size="14">/</text><text x="229" y="510" fill="#91aa97" font-size="14" letter-spacing="2">RUST + TAURI</text>
</g>
