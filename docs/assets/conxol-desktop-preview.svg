<text x="896" y="281" font-size="12" fill="#d9b77c" font-family="Consolas,monospace">CONFIGURATION PREVIEW</text>
<text x="896" y="321" font-size="14" fill="#dce8dc" font-family="Consolas,monospace">interface Eth-Trunk1.200</text>
<text x="896" y="350" font-size="14" fill="#dce8dc" font-family="Consolas,monospace"> description SERVICE-IPBW</text>
<text x="896" y="379" font-size="14" fill="#dce8dc" font-family="Consolas,monospace"> ip binding vpn-instance IPBW</text>
<text x="896" y="408" font-size="14" fill="#c9f464" font-family="Consolas,monospace"> ip address 192.0.2.1 255.255.255.252</text>
<text x="896" y="437" font-size="14" fill="#dce8dc" font-family="Consolas,monospace"> dot1q termination vid 200</text>
<text x="896" y="466" font-size="14" fill="#dce8dc" font-family="Consolas,monospace"> statistics enable</text>
<text x="896" y="495" font-size="14" fill="#dce8dc" font-family="Consolas,monospace">#</text>
<text x="896" y="524" font-size="14" fill="#dce8dc" font-family="Consolas,monospace">bgp 64496</text>
<text x="896" y="553" font-size="14" fill="#dce8dc" font-family="Consolas,monospace"> ipv4-family vpn-instance IPBW</text>
<text x="896" y="582" font-size="14" fill="#dce8dc" font-family="Consolas,monospace">  peer 192.0.2.2 as-number 64497</text>
