name: Publish verified macOS and Linux packages
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful macOS and Linux packages run ID
        required: true
        type: string
      release_tag:
        description: Existing release tag
        required: true
        default: v0.1.60
        type: string
      verify_only:
        description: Verify assets already uploaded without uploading them again
        required: false
        default: false
        type: boolean
      replace_assets:
        description: Replace existing installer and checksum assets after validation
        required: false
        default: false
        type: boolean
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Verify source run
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq '.path')" = '.github/workflows/platform-packages.yml'
          test "$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq '.conclusion')" = success
          gh release view "$RELEASE_TAG" --json tagName
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - name: Verify expected files and checksums
        working-directory: release-assets
        run: |
          version="${RELEASE_TAG#v}"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 7
          test -f "Conxol-$version-macos-arm64.dmg"
          test -f "Conxol-$version-macos-x64.dmg"
          test -f "Conxol-$version-linux-x64.deb"
          test -f "Conxol-$version-linux-x64.AppImage"
          for platform in linux-x64 macos-arm64 macos-x64; do
            sha256sum -c "SHA256SUMS-$platform.txt"
          done
      - name: Attach verified assets to existing release
        if: ${{ !inputs.verify_only }}
        working-directory: release-assets
        env:
          REPLACE_ASSETS: ${{ inputs.replace_assets }}
        run: |
          if [[ "$REPLACE_ASSETS" == true ]]; then
            gh release upload "$RELEASE_TAG" ./*.dmg ./*.deb ./*.AppImage ./SHA256SUMS-*.txt --clobber
          else
            gh release upload "$RELEASE_TAG" ./*.dmg ./*.deb ./*.AppImage ./SHA256SUMS-*.txt
          fi
      - name: Verify uploaded asset hashes
        working-directory: release-assets
        run: |
          # The tag endpoint returns 404 for drafts. Listing releases with this
          # write-scoped token includes both draft and published releases.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\")" > release.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          assets = {asset['name']: asset for asset in release['assets']}
          for path in Path('.').iterdir():
              if path.name == 'release.json':
                  continue
              digest = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              assert assets[path.name]['digest'] == digest, path.name
              print('Verified uploaded bytes:', path.name)
          PY
