name: macOS and Linux packages
run-name: Desktop packages for ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Release tag, branch, or commit SHA to build
        required: true
        default: v0.1.60
        type: string

      test_build:
        description: Build test artifacts from a branch or commit without publishing
        required: false
        default: false
        type: boolean

      platform:
        description: Platforms to build
        required: false
        default: all
        type: choice
        options:
          - all
          - macos
          - macos-arm64

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'macos-arm64' && '[{"runner":"macos-15","platform":"macos-arm64","bundles":"dmg","arch":"arm64"}]' || inputs.platform == 'macos' && '[{"runner":"macos-15","platform":"macos-arm64","bundles":"dmg","arch":"arm64"},{"runner":"macos-15-intel","platform":"macos-x64","bundles":"dmg","arch":"x86_64"}]' || '[{"runner":"ubuntu-22.04","platform":"linux-x64","bundles":"deb,appimage","arch":"x86_64"},{"runner":"macos-15","platform":"macos-arm64","bundles":"dmg","arch":"arm64"},{"runner":"macos-15-intel","platform":"macos-x64","bundles":"dmg","arch":"x86_64"}]') }}
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
      TAURI_BUNDLER_DMG_IGNORE_CI: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: pnpm install --dir apps/desktop --frozen-lockfile
      - name: Check source version and frontend
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          TEST_BUILD: ${{ inputs.test_build }}
        run: |
          version_ref="$SOURCE_REF"
          if [ "$TEST_BUILD" = "true" ]; then
            version_ref="v$(node -p "require('./apps/desktop/package.json').version")"
          fi
          GITHUB_REF_NAME="$version_ref" node tools/release-assets.mjs check-version
          pnpm --dir apps/desktop check
          pnpm --dir apps/desktop lint
          pnpm --dir apps/desktop test:unit
          node --test tools/release-assets.test.mjs
      - name: Test vault and PPTP engine
        run: cargo test --locked -p conxol-vault -p conxol-pptp
      - name: Fetch verified AppRun through GitHub API
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$tools"
          curl --fail --location --retry 3 --max-time 120 \
            -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/tauri-apps/binary-releases/releases/assets/274691722 \
            --output "$tools/AppRun-x86_64.download"
          printf 'f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f  %s\n' "$tools/AppRun-x86_64.download" | sha256sum --check
          chmod 0755 "$tools/AppRun-x86_64.download"
          mv "$tools/AppRun-x86_64.download" "$tools/AppRun-x86_64"
      - name: Generate bundle icons
        run: pnpm --dir apps/desktop tauri icon src-tauri/icons/icon.png
      - name: Build installers
        working-directory: apps/desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json -- --locked
      - name: Verify macOS app
        if: runner.os == 'macOS'
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          mount=$(mktemp -d)
          dmg=$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print)
          printf 'Y\n' | hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"; rmdir "$mount"' EXIT
          app="$mount/Conxol.app"
          test "$(lipo -archs "$app/Contents/MacOS/conxol")" = "$EXPECTED_ARCH"
          codesign --verify --deep --strict "$app"
          version=$(node -p "require('./apps/desktop/package.json').version")
          test "$("$app/Contents/MacOS/conxol" --version)" = "Conxol $version"
      - name: Verify Linux packages
        if: runner.os == 'Linux'
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          test "$(target/release/conxol --version)" = "Conxol $version"
          test "$(dpkg-deb -f target/release/bundle/deb/*.deb Version)" = "$version"
          test "$(dpkg-deb -f target/release/bundle/deb/*.deb Architecture)" = amd64
          file target/release/conxol
      - name: Collect installers and checksums
        run: node tools/release-assets.mjs collect ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: target/release-assets/*
          if-no-files-found: error
