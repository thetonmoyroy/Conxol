name: Publish verified macOS packages

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful macOS packages run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.run_id }}
    steps:
      - name: Verify source build succeeded
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq '.name')" = 'macOS packages'
          test "$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq '.conclusion')" = success
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: installers-macos-*
          merge-multiple: true
          path: macos-assets
      - name: Check hashes and upload release assets
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          cd macos-assets
          sha256sum -c SHA256SUMS-macos-arm64.txt
          sha256sum -c SHA256SUMS-macos-x64.txt
          gh release upload "v$version" ./*.dmg ./SHA256SUMS-macos-*.txt --clobber
