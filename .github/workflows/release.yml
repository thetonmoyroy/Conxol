name: Android ARM64 release build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.69
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android API and NDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build ARM64 release APK
        run: |
          pnpm --dir apps/desktop install --frozen-lockfile
          pnpm --dir apps/desktop tauri android init --ci
          android=apps/desktop/src-tauri/gen/android/app
          cp tools/android/MainActivity.kt "$android/src/main/java/com/othmane/conxol/MainActivity.kt"
          cp -a apps/desktop/src-tauri/icons/android/. "$android/src/main/res/"
          sed -i '/^[[:space:]]*ndkVersion =/d; /^[[:space:]]*ndkPath =/d' "$android/build.gradle.kts"
          sed -i '/android {/a\    ndkVersion = "28.2.13676358"\n    ndkPath = System.getenv("NDK_HOME")' "$android/build.gradle.kts"
          sed -i '/jniLibs\.keepDebugSymbols\.add(/d;s/isJniDebuggable = true/isJniDebuggable = false/' "$android/build.gradle.kts"
          pnpm --dir apps/desktop tauri android build --apk --target aarch64 --ci --config '{"bundle":{"android":{"versionCode":1069}}}'
      - name: Check APK metadata and payload
        run: |
          mkdir -p release-assets
          apk=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' -print -quit)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -f -P 16 4 "$apk" release-assets/Conxol-0.1.69-android-arm64-unsigned.apk
          cd release-assets
          apk=Conxol-0.1.69-android-arm64-unsigned.apk
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/conxol-apk-metadata"
          grep -F "versionCode='1069' versionName='0.1.69'" "$RUNNER_TEMP/conxol-apk-metadata"
          grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/conxol-apk-metadata"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/conxol-apk-files"
          if grep -Ei '\.(exe|dll)$' "$RUNNER_TEMP/conxol-apk-files"; then exit 1; fi
          sha256sum "$apk" > SHA256SUMS-android-arm64-unsigned.txt
          sha256sum -c SHA256SUMS-android-arm64-unsigned.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-unsigned-v0.1.69
          path: release-assets/*
          if-no-files-found: error
