[package]
name = "conxol"
description = "Conxol terminal and remote connection manager"
authors = ["Tonmoy"]
homepage = "https://github.com/thetonmoyroy/Conxol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "conxol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
argon2 = "0.6.0"
getrandom = "0.4.3"
subtle = "2.6"
tempfile = "3.23.0"
anyhow.workspace = true
conxol-core = { path = "../../../crates/conxol-core" }
conxol-telnet = { path = "../../../crates/conxol-telnet" }
conxol-ssh = { path = "../../../crates/conxol-ssh" }
conxol-serial = { path = "../../../crates/conxol-serial" }
conxol-network = { path = "../../../crates/conxol-network" }
conxol-remote-desktop = { path = "../../../crates/conxol-remote-desktop" }
conxol-store = { path = "../../../crates/conxol-store" }
conxol-vault = { path = "../../../crates/conxol-vault" }
portable-pty = "0.9"
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.1", features = [] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize = { workspace = true, features = ["serde"] }
tauri-plugin-clipboard-manager = "2"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-collections = "0.3.2"
windows = { version = "0.62.2", features = ["ApplicationModel", "Services_Store", "Win32_UI_Shell", "Win32_Foundation"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
russh.workspace = true
russh-sftp.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15.4"
