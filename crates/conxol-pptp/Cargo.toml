[package]
name = "conxol-pptp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Private native PPTP/MPPE transport without host VPN routes"

[dependencies]
des = "0.8.1"
md4 = "0.10.2"
sha1 = "0.10.6"
getrandom = "0.4.3"
zeroize = "1.8"
tokio = { version = "1", features = ["io-util", "sync", "time"] }
rc4 = { version = "0.1.0", features = ["zeroize"] }
smoltcp = { version = "0.12.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-icmp", "socket-raw"] }

[dev-dependencies]
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true
