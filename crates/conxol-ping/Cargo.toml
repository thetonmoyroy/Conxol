[package]
name = "conxol-ping"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native Conxol ICMP ping engine and standalone CLI"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "android"))'.dependencies]
libc.workspace = true
rand = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper"] }
